<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get TeeSheet TC</title>
  <meta name="description" content="Download TeeSheet TC for iPhone or Android.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="prose" style="text-align:center">
  <h1>TeeSheet TC</h1>
  <p>Every tee time in the Twin Cities. One search.</p>
  <div class="badges" style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:1.5em">
    <a id="play" href="https://play.google.com/store/apps/details?id=com.teesheetc.tee_times_app">
      <img alt="Get it on Google Play" src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" style="height:72px">
    </a>
    <a id="ios" href="https://apps.apple.com/us/app/teesheet-tc/id6762153205">
      <img alt="Download on the App Store" src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" style="height:50px">
    </a>
  </div>
</main>
<script>
(function () {
  // Smart store redirect. ?src=<tag> tags where the scan came from (a course
  // card, a flyer, an email); it is passed through to Play's install referrer
  // so installs can be attributed per source in the Play Console.
  var src = new URLSearchParams(location.search).get('src') || 'get-page';
  var play = 'https://play.google.com/store/apps/details?id=com.teesheetc.tee_times_app'
           + '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=qr');
  // Play deep links use ?id=..., fix the separator:
  play = play.replace('?id=', '?id=');
  var ios = 'https://apps.apple.com/us/app/teesheet-tc/id6762153205';
  document.getElementById('play').href = play;
  var ua = navigator.userAgent || '';
  if (/android/i.test(ua)) location.replace(play);
  else if (/iphone|ipad|ipod/i.test(ua)) location.replace(ios);
  // Desktop / unknown: stay here and show both badges.
})();
</script>
</body>
</html>
